name: FPL model

on:
  schedule:
    # 05:17 UTC = 07:17 Windhoek, before the 08:57 brief. Second run at 13:17 UTC for late news on deadline days.
    # 23:47 UTC run sits before FPL's overnight price update (about 01:30 UK time), allowing for GitHub schedule delays.
    - cron: '47 23 * * *'
    - cron: '17 5 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run model
        env:
          FPL_ENTRY: '531300'
          FPL_LEAGUES: '54818,392003'
          FPL_ELITE: '1000'
        run: node fpl.mjs
      - name: Commit report
        run: |
          git config user.name "fpl-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Report $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
